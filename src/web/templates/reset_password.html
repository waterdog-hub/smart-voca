{# 2026-11-05 - smart-voca - P-07 새 비밀번호 설정. 토큰은 URL 조각에서 읽는다. 파일 위치: src/web/templates/reset_password.html #}
{% extends "base.html" %}
{% block content %}
<form id="reset-form" novalidate>
  <div class="field">
    <label for="new_password">새 비밀번호</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="new_password-help" required>
    <p class="help" id="new_password-help">8자 이상, 128자 이하로 입력하세요.</p>
    <p class="field-error" id="new_password-error" hidden></p>
  </div>
  <div class="field">
    <label for="new_password_again">새 비밀번호 확인</label>
    <input id="new_password_again" name="new_password_again" type="password" autocomplete="new-password" maxlength="128" required>
    <p class="field-error" id="new_password_again-error" hidden></p>
  </div>
  <button type="submit">비밀번호 바꾸기</button>
</form>
<noscript><p>비밀번호 재설정에는 자바스크립트가 필요합니다.</p></noscript>
<p class="links"><a href="/login">로그인 화면으로 이동</a></p>
{% endblock %}
