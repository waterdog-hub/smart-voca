{# 2026-11-05 - smart-voca - W-01 내 단어. 담은 단어장의 단어를 읽기만 한다 (결정 D-WB04). 파일 위치: src/web/templates/words.html #}
{% extends "member_base.html" %}
{% block scripts %}<script src="/static/words.js" defer></script>{% endblock %}
{% block member_content %}
<div class="words-toolbar">
  <div class="field words-search">
    <label for="word-search">검색</label>
    <input id="word-search" type="search" maxlength="100" placeholder="단어 또는 뜻" autocomplete="off">
  </div>
  <a class="button-link" href="/wordbooks">단어장 고르기</a>
</div>
<p class="help" id="word-total" aria-live="polite"></p>

<div id="word-empty" class="empty-state" hidden>
  <p id="word-empty-text"></p>
  <a class="button-link" id="word-empty-link" href="/wordbooks" hidden>단어장 고르기</a>
</div>

<div id="word-table-area" aria-busy="true">
  <table class="word-table">
    <caption class="visually-hidden">내 단어 목록. 열 제목의 버튼을 누르면 정렬됩니다.</caption>
    <thead>
      <tr>
        <th scope="col" data-sort="word"><button type="button" class="sort-button">단어</button></th>
        <th scope="col" data-sort="meaning"><button type="button" class="sort-button">뜻</button></th>
        <th scope="col" data-sort="created"><button type="button" class="sort-button">등록일</button></th>
      </tr>
    </thead>
    <tbody id="word-rows"></tbody>
  </table>
</div>

<div class="words-footer">
  <div class="pager">
    <button type="button" id="page-prev" class="secondary">이전</button>
    <span id="page-info"></span>
    <button type="button" id="page-next" class="secondary">다음</button>
  </div>
</div>
{% endblock %}
