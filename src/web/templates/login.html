{% extends "base.html" %}
{% block content %}
<form id="login-form">
  <div class="field">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
    <p class="field-error" id="email-error" hidden></p>
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <p class="field-error" id="password-error" hidden></p>
  </div>
  <button type="submit">로그인</button>
</form>
{% if withdrawn %}<p class="message ok" id="withdrawn-notice">탈퇴가 완료되었습니다. 회원 데이터를 모두 삭제했습니다.</p>{% endif %}
<p class="links">계정이 없으신가요? <a href="/signup">가입하기</a></p>
<p class="links"><a href="/forgot-password">비밀번호를 잊으셨나요?</a></p>
{% endblock %}
