<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} - smart-voca</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/auth.js" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body>
  <header class="site-header"><a href="/">smart-voca</a></header>
  {% block body %}
  <main class="panel" data-page="{{ page }}">
    <h1>{{ title }}</h1>
    <p class="message" id="message" role="alert" hidden></p>
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
