{% extends "base.html" %}
{% block content %}
<form id="signup-form">
  <div class="field">
    <label for="email">이메일</label>
    <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
    <p class="field-error" id="email-error" hidden></p>
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="password-help" required>
    <p class="help" id="password-help">8자 이상, 128자 이하로 입력하세요.</p>
    <p class="field-error" id="password-error" hidden></p>
  </div>
  <div class="field">
    <label for="display_name">표시 이름</label>
    <input id="display_name" name="display_name" type="text" autocomplete="nickname" maxlength="100" required>
    <p class="field-error" id="display_name-error" hidden></p>
  </div>
  <div class="field check">
    <input id="terms_agreed" name="terms_agreed" type="checkbox" required>
    <label for="terms_agreed">이용약관에 동의합니다 (필수)</label>
    <p class="field-error" id="terms_agreed-error" hidden></p>
  </div>
  <div class="field check">
    <input id="privacy_agreed" name="privacy_agreed" type="checkbox" required>
    <label for="privacy_agreed">개인정보 처리방침에 동의합니다 (필수)</label>
    <p class="field-error" id="privacy_agreed-error" hidden></p>
  </div>
  <button type="submit">가입하기</button>
</form>
<p class="links">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
{% endblock %}
