# 단어장 앱 배포 점검 — AI기반프로그래밍 2026-2 기말 (이 파일은 수정하지 마세요)
# 학교 서버와 같은 조건으로 앱을 띄워 봅니다.
#   - 인터넷이 막힌 네트워크, UID 10001, 리눅스 권한 없음, 메모리 1GB
#   - SQLite(/data, 기본)와 PostgreSQL 17(db:5432, 사전 협의한 경우)을 둘 다 제공 — 앱은 하나를 골라 쓴다
#   - 앞단 nginx 가 /2026/voca-check/ 아래로 앱을 옮긴다 (앱은 / 기준으로 만들면 된다)
name: docker-check
on: [push, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      P: /2026/voca-check
    steps:
      - uses: actions/checkout@v4

      - name: 0. Hadolint (참고용 — 실패로 처리하지 않음)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013,DL3016
          no-fail: true

      - name: 1. 빌드 (리포 루트 Dockerfile)
        run: docker build -t voca-app .

      - name: 2. 서버 환경 준비 (인터넷 차단 네트워크, PostgreSQL, 앞단 nginx)
        run: |
          docker network create --internal voca-net
          docker volume create voca-data
          docker run -d --name db --network voca-net \
            -e POSTGRES_DB=voca -e POSTGRES_USER=voca -e POSTGRES_PASSWORD=check-pass postgres:17
          docker run -d --name probe --network voca-net --entrypoint sleep curlimages/curl:8.10.1 infinity
          cat > front.conf <<'EOF'
          server {
            listen 8080;
            client_max_body_size 20m;
            location = @P@ { return 301 @P@/; }
            location @P@/ {
              proxy_pass http://app:8080/;
              proxy_set_header Host $host;
              proxy_set_header Accept-Encoding "";
              proxy_redirect http://$host/ @P@/;
              proxy_redirect https://$host/ @P@/;
              proxy_redirect / @P@/;
              proxy_cookie_path / @P@/;
              sub_filter_types text/css application/javascript text/javascript;
              sub_filter_once off;
              sub_filter 'href="//'  'href="//';
              sub_filter 'src="//'   'src="//';
              sub_filter 'href="/'   'href="@P@/';
              sub_filter "href='/"   "href='@P@/";
              sub_filter 'src="/'    'src="@P@/';
              sub_filter "src='/"    "src='@P@/";
              sub_filter 'action="/' 'action="@P@/';
              sub_filter "action='/" "action='@P@/";
              sub_filter 'url(/'     'url(@P@/';
              sub_filter 'fetch("/'  'fetch("@P@/';
              sub_filter "fetch('/"  "fetch('@P@/";
              sub_filter 'fetch(`/'  'fetch(`@P@/';
              sub_filter 'href = "/' 'href = "@P@/';
              sub_filter "href = '/" "href = '@P@/";
            }
          }
          EOF
          sed -i "s#@P@#$P#g" front.conf
          for i in $(seq 1 60); do
            docker exec db pg_isready -U voca -d voca -q && break
            sleep 2
          done
          echo "PostgreSQL 준비 완료"

      - name: 3. 앱 실행 (서버와 같은 조건)
        run: |
          docker run -d --name app --network voca-net \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --memory 1g \
            -e DB_PATH=/data/voca.db \
            -e DB_HOST=db -e DB_PORT=5432 -e DB_NAME=voca -e DB_USER=voca -e DB_PASS=check-pass \
            -e SECRET_KEY=check-secret \
            -v voca-data:/data voca-app
          docker run -d --name front --network voca-net \
            -v "$PWD/front.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine

      - name: 4. 첫 화면 응답 (30초 안에)
        run: |
          for i in $(seq 1 30); do
            r=$(docker exec probe curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://front:8080$P/" || true)
            code=${r%% *}; loc=${r#* }
            case "$code" in
              2??) echo "OK $code"; exit 0 ;;
              3??) case "$loc" in *"$P/"*) echo "OK $code -> $loc"; exit 0 ;; esac
                   echo "FAIL: 앱 밖으로 리다이렉트 -> $loc"; exit 1 ;;
            esac
            sleep 1
          done
          echo "FAIL: 30초 안에 첫 화면 응답 없음 (마지막: $r)"; exit 1

      - name: 5. 첫 화면 링크 점검
        run: |
          docker exec probe curl -sL "http://front:8080$P/" > page.html
          python3 - "$P" <<'PY' > links.txt
          import sys
          from html.parser import HTMLParser
          class L(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for k, v in attrs:
                      if k in ("href", "src", "action") and v:
                          print(f"{tag} {v}")
          L().feed(open("page.html", encoding="utf-8", errors="replace").read())
          PY
          bad=0
          while read -r tag url; do
            case "$url" in
              //*|http:*|https:*|\#*|mailto:*|javascript:*|data:*) continue ;;
              "$P"/*) full="$url" ;;
              /*) echo "FAIL  $tag $url  (앱 밖을 가리키는 주소)"; bad=1; continue ;;
              *) full="$P/$url" ;;
            esac
            [ "$tag" = form ] && { echo "skip  form $url"; continue; }
            code=$(docker exec probe curl -s -o /dev/null -w '%{http_code}' "http://front:8080$full")
            case "$code" in [23]??) echo "ok    $code $tag $url" ;; *) echo "WARN  $code $tag $url" ;; esac
          done < links.txt
          exit $bad

      - name: 6. 재시작 후 응답과 데이터 위치
        run: |
          docker restart app && sleep 5
          docker exec probe curl -sf -o /dev/null "http://front:8080$P/" || { echo "FAIL: 재시작 후 응답 없음"; exit 1; }
          echo "/data:"; docker run --rm -v voca-data:/data busybox:1.36 ls -la /data
          echo "PostgreSQL 테이블:"; docker exec db psql -U voca -d voca -c '\dt' 2>/dev/null || true

      - name: 7. 이미지 크기
        if: always()
        run: docker image ls voca-app --format '{{.Repository}} {{.Size}}'

      - name: 실패하면 앱 로그
        if: failure()
        run: docker logs app 2>&1 | tail -n 100 || true
